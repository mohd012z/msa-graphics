<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>MSA Physics Lab</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#101923;color:#e6edf3;font:15px/1.4 system-ui,sans-serif;margin:0 auto;padding:12px;max-width:720px}h1{font-size:18px;margin:4px 0 8px}canvas{display:block;width:100%;height:auto;background:#071421;border-radius:10px;touch-action:none}button,select{min-height:44px;font:inherit;color:#e6edf3;background:#17324a;border:1px solid #2f5470;border-radius:10px;padding:0 12px;cursor:pointer}:focus-visible{outline:2px solid #67e8f9;outline-offset:2px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.hint{color:#9fb3c8;font-size:13px;margin:6px 0}#stats{color:#9fb3c8;font-size:13px;margin:6px 0;min-height:1.4em}</style><main><h1>Physics &amp; Geometry Lab</h1><div class="row"><label for="mode" style="flex-direction:row;align-items:center;gap:8px;margin:0">Mode <select id="mode"><option>sphere</option><option>torus</option><option>cylinder</option><option>cone</option><option>plane</option><option>gravity</option><option>spectral</option><option>physics</option><option>particles</option></select></label><button id="pause">Pause</button></div><p class="hint">Drag to rotate. Scroll to zoom.</p><canvas width="640" height="400" role="img" aria-label="3D preview"></canvas><p id="stats" role="status"></p></main><script type="module" src="lab.mjs"></script></html>
