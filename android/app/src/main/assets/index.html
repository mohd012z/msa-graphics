<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>MSA Water Lab</title><style>body{background:#101923;color:#eee;font:16px system-ui;margin:16px}canvas{width:100%;background:#182c40}label{display:block;margin:16px 0}input{width:100%}</style><h1>MSA Water Lab</h1><p id="status">Canvas 2D — illustrative wave model</p><canvas width="640" height="360"></canvas><label>Depth <input id="depth" type="range" min="0.5" max="4" step="0.1" value="1.5"></label><label>Period <input id="period" type="range" min="0.5" max="5" step="0.1" value="2"></label><label>Amplitude <input id="amplitude" type="range" min="0" max="0.5" step="0.01" value="0.3"></label><label>Quality <select id="quality"><option value="low">Low</option><option value="balanced" selected>Balanced</option><option value="high">High</option></select></label><button id="save">Save scene</button> <button id="load">Load scene</button> <button id="pause">Pause</button><script type="module" src="app.mjs"></script>
