<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>MSA Water Lab</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#0b1620;color:#e6edf3;font:15px/1.4 system-ui,sans-serif;margin:0 auto;padding:12px;max-width:720px}h1{font-size:18px;margin:4px 0 8px}canvas{display:block;width:100%;height:auto;background:#10263a;border-radius:10px}button,select{min-height:44px;font:inherit;color:#e6edf3;background:#17324a;border:1px solid #2f5470;border-radius:10px;padding:0 12px;cursor:pointer}:focus-visible{outline:2px solid #67e8f9;outline-offset:2px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}#status{color:#9fb3c8;font-size:13px;overflow-wrap:anywhere;margin:6px 0;min-height:1.4em}label{display:flex;flex-direction:column;gap:2px;margin:8px 0}.field{display:flex;justify-content:space-between}output{color:#67e8f9;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#67e8f9;height:32px;margin:0}</style><h1>MSA Water Lab</h1><p id="status" role="status">Starting…</p><canvas width="640" height="360" role="img" aria-label="Water wave preview"></canvas><label for="depth"><span class="field">Depth <output id="depth-out">1.50</output></span><input id="depth" type="range" min="0.5" max="4" step="0.1" value="1.5"></label><label for="period"><span class="field">Period <output id="period-out">2.00</output></span><input id="period" type="range" min="0.5" max="5" step="0.1" value="2"></label><label for="amplitude"><span class="field">Amplitude <output id="amplitude-out">0.30</output></span><input id="amplitude" type="range" min="0" max="0.5" step="0.01" value="0.3"></label><div class="row"><label for="quality" style="flex-direction:row;align-items:center;gap:8px;margin:0">Quality <select id="quality"><option value="low">Low</option><option value="balanced" selected>Balanced</option><option value="high">High</option></select></label></div><div class="row"><button id="pause">Pause</button><button id="save">Save scene</button><button id="load">Load scene</button></div><script type="module" src="app.mjs"></script>
