<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>Animation Studio</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#091321;color:#e2e8f0;font:15px/1.4 system-ui,sans-serif;margin:0 auto;padding:12px;max-width:720px}h1{font-size:18px;margin:4px 0 8px}canvas{display:block;width:100%;background:#102438;border-radius:10px}button,select{min-height:44px;font:inherit;color:#e2e8f0;background:#18364b;border:1px solid #46748b;border-radius:10px;padding:0 12px;cursor:pointer}:focus-visible{outline:2px solid #67e8f9;outline-offset:2px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}#status{color:#9fb3c8;font-size:13px;overflow-wrap:anywhere;margin:6px 0;min-height:1.4em}label{display:flex;flex-direction:column;gap:4px;margin:8px 0}input[type=range]{width:100%;accent-color:#67e8f9;height:32px;margin:0}textarea{width:100%;min-height:120px;font:13px ui-monospace,monospace;background:#12283a;color:#e2e8f0;border:1px solid #46748b;border-radius:10px;padding:8px;box-sizing:border-box}</style><main><h1>Animation Studio</h1><canvas width="640" height="360" role="img" aria-label="Animation preview"></canvas><p id="status" role="status"></p><label>Timeline <input id="seek" type="range" min="0" max="5" step="0.01" value="0"></label><div class="row"><button id="play">Play</button><button id="pause">Pause</button><button id="reset">Restart</button><label style="flex-direction:row;align-items:center;gap:8px;margin:0">Preview <select id="mode"><option value="scene">Scene</option><option value="particles">Particles</option><option value="graph">Graph flow</option></select></label></div><label>Animation JSON <textarea id="doc" spellcheck="false"></textarea></label><div class="row"><button id="apply">Apply</button><button id="save">Save locally</but
