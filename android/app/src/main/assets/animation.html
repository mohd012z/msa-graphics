<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>Animation Studio</title><style>body{background:#091321;color:#e2e8f0;font:16px system-ui;margin:12px}canvas{width:100%;background:#102438;border-radius:12px}button,select{min-height:48px;background:#18364b;color:white;border:1px solid #46748b;border-radius:8px;padding:8px}textarea,input{width:100%;box-sizing:border-box}textarea{background:#12283a;color:white;min-height:100px}label{display:block;margin:10px 0}h1{font-size:22px}#status{overflow-wrap:anywhere}</style><h1>Animation Studio</h1><canvas width="640" height="360" aria-label="Animation preview"></canvas><p id="status" role="status"></p><label>Timeline <input id="seek" type="range" min="0" max="5" step="0.01" value="0"></label><button id="play">Play</button> <button id="pause">Pause</button> <button id="reset">Restart</button><label>Preview <select id="mode"><option value="scene">Scene</option><option value="particles">Particles</option><option value="graph">Graph flow</option></select></label><label>Animation JSON <textarea id="doc" spellcheck="false"></textarea></label><button id="apply">Apply</button> <button id="save">Save locally</button> <button id="load">Load</button><script type="module" src="animation-ui.mjs"></script></html>
