<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob:; media-src blob:"><title>Production Studio</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#091321;color:#e2e8f0;font:15px/1.4 system-ui,sans-serif;margin:0 auto;padding:12px;max-width:720px}h1{font-size:18px;margin:4px 0 8px}h2{font-size:14px;color:#9fb3c8;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}canvas{display:block;width:100%;background:#102438;border-radius:10px}button,select,input[type=file]{min-height:44px;font:inherit;color:#e2e8f0;background:#19344a;border:1px solid #47617a;border-radius:10px;padding:0 12px;max-width:100%}button{cursor:pointer}:focus-visible{outline:2px solid #67e8f9;outline-offset:2px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.hint{color:#9fb3c8;font-size:13px;margin:2px 0}#status{color:#9fb3c8;font-size:13px;overflow-wrap:anywhere;margin:6px 0;min-height:1.4em}label{display:flex;flex-direction:column;gap:4px;margin:6px 0}input[type=range]{width:100%;accent-color:#67e8f9;height:32px;margin:0}textarea{width:100%;height:120px;box-sizing:border-box;font:13px ui-monospace,monospace;background:#12283a;color:#e2e8f0;border:1px solid #47617a;border-radius:10px;padding:8px}details{margin-top:12px}summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:#9fb3c8}</style><main><h1>Production Studio</h1><canvas width="640" height="360" role="img" aria-label="Production preview"></canvas><p id="status" role="status">Pick media below, then press Play.</p><h2>Media</h2><label>Image <input id="image" type="file" accept="image/png,image/jpeg,image/webp"><span class="hint">PNG, JPEG or WebP, up to 20 MB.</span></label><label>Audio <input id="audio" type="file" accept="audio/*"><span class="hint">Up to 20 MB and 300 seconds. Optional.</span></label><h2>Playback</h2><label>Timeline <input id="seek" type="range" min="0" max="299" value="0"></label><div class="row"><button id="play">Play</button><button id="pause">Pause</button><label style="flex-direction:row;align-items:center;gap:8px;margin:0">Preview FPS <select id="fps"><option>24</option><option selected>30</option><option>60</option></select></label></div><details><summary>Advanced composition &amp; recovery</summary><label>Composition JSON <textarea id="project"></textarea></label><div class="row"><button id="apply">Apply</button><button id="save">Save metadata</button><button id="load">Recover metadata</button></div></details></main><script type="module" src="production-ui.mjs"></script></html>
