<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob:; media-src blob:"><title>Production Studio</title><style>body{background:#091321;color:#e2e8f0;font:16px system-ui;margin:12px}canvas{width:100%;background:#102438}input,select,button{max-width:100%;min-height:44px}label{display:block;margin:8px 0}textarea{width:100%;height:100px;box-sizing:border-box}h1{font-size:20px;margin:4px 0 8px}button,select{background:#19344a;color:#e2e8f0;border:1px solid #47617a;border-radius:8px;padding:0 12px}canvas{display:block;border-radius:8px}input[type=range]{width:100%;box-sizing:border-box}details{margin-top:8px}summary{padding:12px 0}</style><h1>Production Studio</h1><canvas width="640" height="360"></canvas><p id="status" role="status"></p><label>Local image <input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Local audio <input id="audio" type="file" accept="audio/*"></label><label>Preview FPS <select id="fps"><option>24</option><option selected>30</option><option>60</option></select></label><input id="seek" type="range" min="0" max="299" value="0"><button id="play">Play</button><button id="pause">Pause</button><details><summary>Advanced composition &amp; recovery</summary><label>Composition JSON<textarea id="project"></textarea></label><button id="apply">Apply</button><button id="save">Save metadata</button><button id="load">Recover metadata</button></details><script type="module" src="production-ui.mjs"></script></html>
